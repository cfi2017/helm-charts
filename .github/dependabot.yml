
version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # Maintain base images for OpenCVE images published to GHCR
  - package-ecosystem: "docker"
    directory: "/images/opencve/web"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/images/opencve/scheduler"
    schedule:
      interval: "daily"
