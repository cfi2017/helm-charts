name: Lint and Test Charts

on:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Test Pages publishing script
      run: bash hack/ci/tests/update-page.sh

    - name: Set up Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.17.4

    - name: install helm unittest
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        helm env
        bash hack/ci/github/setup/helm-unittest.sh

    - uses: actions/setup-python@v7
      with:
        python-version:  '3.x'

    - name: Test Nix builder TCP activator
      if: hashFiles('charts/nix-builder/files/proxy.py') != ''
      run: python3 hack/ci/tests/nix-builder-proxy.py

    - name: Test Attic catch-up and shutdown coordination
      if: hashFiles('charts/nix-builder/files/attic-uploader.py') != ''
      run: python3 hack/ci/tests/nix-builder-attic.py

    - name: Setup environment for pre-commit
      run: bash hack/ci/github/run-with-summary.sh bash hack/ci/github/setup/pre-commit.sh

    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit
      run: |
        bash hack/ci/github/run-with-summary.sh pre-commit run --show-diff-on-failure --color=always --files $(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | xargs)

  lint-test:
    name: Lint and Install
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.4

      - name: install helm unittest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          helm env
          bash hack/ci/github/setup/helm-unittest.sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install chart-testing
        run: bash hack/ci/github/run-with-summary.sh bash hack/ci/github/setup/chart-testing.sh

      - name: Install Artifact Hub CLI tool
        run: bash hack/ci/github/run-with-summary.sh bash hack/sh/deps/ah.sh

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct --config=hack/chart-testing/ct.yaml list-changed)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-testing (lint)
        run: bash hack/ci/github/run-with-summary.sh ct --config=hack/chart-testing/ct.yaml lint

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2
        if: steps.list-changed.outputs.changed == 'true'

      - name: Setup cluster for chart-testing (install)
        run: bash hack/ci/github/run-with-summary.sh bash hack/deploy/init.sh
        if: steps.list-changed.outputs.changed == 'true'

      - name: Run chart-testing (install)
        run: bash hack/ci/github/run-with-summary.sh ct --config=hack/chart-testing/ct-install.yaml install

  nix-builder-worker:
    name: Nix remote build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build a derivation through SSH and verify persistent host key
        run: bash hack/ci/github/run-with-summary.sh bash hack/ci/tests/nix-builder-worker.sh

  nix-builder-attic:
    name: Attic publication and download smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify startup catch-up, publication, restart recovery and downloads
        run: bash hack/ci/github/run-with-summary.sh bash hack/ci/tests/nix-builder-attic.sh
