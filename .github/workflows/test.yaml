name: Lint and Test Charts

on:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Test Pages publishing script
      run: bash hack/ci/tests/update-page.sh

    - name: Set up Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.17.4

    - name: install helm unittest
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        helm env
        bash hack/ci/github/setup/helm-unittest.sh

    - uses: actions/setup-python@v7
      with:
        python-version:  '3.x'

    - name: Setup environment for pre-commit
      run: hack/ci/github/setup/pre-commit.sh

    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit
      run: |
        pre-commit run --show-diff-on-failure --color=always --files $(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | xargs)

  lint-test:
    name: Lint and Install
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.4

      - name: install helm unittest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          helm env
          bash hack/ci/github/setup/helm-unittest.sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install chart-testing
        run: bash hack/ci/github/setup/chart-testing.sh

      - name: Install Artifact Hub CLI tool
        run: hack/sh/deps/ah.sh

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct --config=hack/chart-testing/ct.yaml list-changed)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-testing (lint)
        run: ct --config=hack/chart-testing/ct.yaml lint

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2
        if: steps.list-changed.outputs.changed == 'true'

      - name: Setup cluster for chart-testing (install)
        run: hack/deploy/init.sh
        if: steps.list-changed.outputs.changed == 'true'

      - name: Run chart-testing (install)
        run: ct --config=hack/chart-testing/ct-install.yaml install

  diagnose-setup:
    name: Diagnose previous CI setup failure
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Read failed setup logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view 42581998071 --job 129042699993 --log-failed > /tmp/previous-failure.log
          message=$(tail -n 20 /tmp/previous-failure.log | cut -f3-)
          message=${message//'%'/'%25'}
          message=${message//$'\r'/'%0D'}
          message=${message//$'\n'/'%0A'}
          printf '::warning title=Previous setup failure::%s\n' "$message"
