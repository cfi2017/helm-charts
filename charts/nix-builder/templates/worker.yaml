apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nix-builder.fullname" . }}
  labels:
    {{- include "nix-builder.labels" . | nindent 4 }}
spec:
  {{- if not .Values.scaleToZero.enabled }}
  replicas: 1
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nix-builder.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.ssh.existingSecret }}
        checksum/keys: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "nix-builder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ if (and .Values.attic .Values.attic.enabled) }}{{ max 60 (add .Values.attic.drainTimeoutSeconds 30) }}{{ else }}60{{ end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: initialize-store
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/config/worker.sh"]
          env:
            - name: INITIALIZE_STORE
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
        {{- if (and .Values.attic .Values.attic.enabled) }}
        - name: install-attic
          image: "{{ .Values.attic.toolsImage.repository }}:{{ .Values.attic.toolsImage.tag }}"
          imagePullPolicy: {{ .Values.attic.toolsImage.pullPolicy }}
          command: ["/bin/sh", "/config/install-attic.sh"]
          volumeMounts:
            - name: data
              mountPath: /shared-nix
              subPath: nix
            - name: attic-bin
              mountPath: /attic-bin
            - name: config
              mountPath: /config
        - name: register-attic
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/config/worker.sh"]
          env:
            - name: REGISTER_ATTIC
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /nix
              subPath: nix
            - name: attic-bin
              mountPath: /attic-bin
              readOnly: true
            - name: config
              mountPath: /config
        {{- end }}
      containers:
        - name: builder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/config/worker.sh"]
          ports:
            - name: ssh
              containerPort: 2222
          # Exec probes avoid opening SSH sessions through the activator.
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -s /run/sshd.pid && kill -0 $(cat /run/sshd.pid)"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /nix
              subPath: nix
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: config
              mountPath: /etc/nix/nix.conf
              subPath: nix.conf
            - name: keys
              mountPath: /keys
              readOnly: true
            {{- if (and .Values.attic .Values.attic.enabled) }}
            - name: attic-runtime
              mountPath: /attic-runtime
              readOnly: true
            {{- end }}
        {{- if (and .Values.attic .Values.attic.enabled) }}
        - name: attic-uploader
          image: {{ .Values.attic.controllerImage | quote }}
          command: [python, -u, /config/attic-uploader.py]
          ports:
            - name: attic-control
              containerPort: 8090
          env:
            - name: ATTIC_ENDPOINT
              value: {{ .Values.attic.endpoint | quote }}
            - name: ATTIC_CACHE
              value: {{ .Values.attic.cache | quote }}
            - name: ATTIC_JOBS
              value: {{ .Values.attic.jobs | quote }}
            - name: DRAIN_TIMEOUT
              value: {{ .Values.attic.drainTimeoutSeconds | quote }}
            - name: RETRY_SECONDS
              value: {{ .Values.attic.retrySeconds | quote }}
            - name: CATCH_UP_INTERVAL
              value: {{ .Values.attic.catchUpIntervalSeconds | quote }}
            - name: CONFIGURE_NIX
              value: {{ .Values.attic.configureNix | quote }}
            - name: SSL_CERT_FILE
              value: /nix/var/nix/profiles/default/etc/ssl/certs/ca-bundle.crt
          readinessProbe:
            httpGet:
              path: /health
              port: attic-control
          lifecycle:
            preStop:
              exec:
                command: [python, /config/attic-uploader.py, --drain]
          resources:
            {{- toYaml .Values.attic.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /nix
              subPath: nix
            - name: attic-bin
              mountPath: /attic-bin
              readOnly: true
            - name: attic-runtime
              mountPath: /attic-runtime
            - name: attic-auth
              mountPath: /attic-auth
              readOnly: true
            - name: config
              mountPath: /config
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "nix-builder.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "nix-builder.fullname" . }}
        - name: keys
          secret:
            secretName: {{ default (printf "%s-keys" (include "nix-builder.fullname" .)) .Values.ssh.existingSecret }}
            defaultMode: 0400
        {{- if (and .Values.attic .Values.attic.enabled) }}
        - name: attic-bin
          emptyDir: {}
        - name: attic-runtime
          emptyDir: {}
        - name: attic-auth
          secret:
            secretName: {{ required "attic.auth.existingSecret is required" .Values.attic.auth.existingSecret }}
            defaultMode: 0400
            items:
              - key: {{ .Values.attic.auth.secretKey }}
                path: token
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
