apiVersion: v1
kind: Service
metadata:
  name: {{ include "nix-builder.fullname" . }}
  labels:
    {{- include "nix-builder.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: ssh
      port: {{ .Values.ssh.port }}
      targetPort: ssh
  selector:
    {{- include "nix-builder.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "proxy" "worker" .Values.scaleToZero.enabled }}
{{- if .Values.scaleToZero.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nix-builder.fullname" . }}-worker
  labels:
    {{- include "nix-builder.labels" . | nindent 4 }}
spec:
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
  selector:
    {{- include "nix-builder.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
