apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nix-builder.fullname" . }}
  labels:
    {{- include "nix-builder.labels" . | nindent 4 }}
data:
  worker.sh: |
    {{- .Files.Get "files/worker.sh" | nindent 4 }}
  sshd_config: |
    {{- .Files.Get "files/sshd_config" | nindent 4 }}
  nix.conf: |
    {{- .Values.nixConfig | nindent 4 }}
    {{- if and (and .Values.attic .Values.attic.enabled) .Values.attic.configureNix }}
    !include /attic-runtime/nix/nix.conf
    {{- end }}
  proxy.py: |
    {{- .Files.Get "files/proxy.py" | nindent 4 }}
  {{- if (and .Values.attic .Values.attic.enabled) }}
  install-attic.sh: |
    {{- .Files.Get "files/install-attic.sh" | nindent 4 }}
  attic-uploader.py: |
    {{- .Files.Get "files/attic-uploader.py" | nindent 4 }}
  {{- end }}
