nameOverride: ""
fullnameOverride: ""
image:
  repository: nixos/nix
  tag: "2.24.14"
  pullPolicy: IfNotPresent
imagePullSecrets: []
ssh:
  # Existing Secret with authorized_keys. Inline public keys are also supported.
  existingSecret: ""
  authorizedKeys: ""
  # Host key is stored on the data PVC across worker restarts.
  port: 22
persistence:
  enabled: true
  existingClaim: ""
  size: 50Gi
  storageClass: null
nixConfig: |
  experimental-features = nix-command flakes
  sandbox = false
  max-jobs = auto
  cores = 0
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
# Optional Attic publisher. The target cache must already exist.
attic:
  enabled: false
  endpoint: ""
  # One concrete cache name, never a token permission pattern such as efi-*.
  cache: ""
  auth:
    existingSecret: ""
    secretKey: token
  toolsImage:
    repository: nixpkgs/attic
    # Use nixos-26.05-aarch64-linux on ARM64 nodes.
    tag: nixos-26.05-x86_64-linux
    pullPolicy: IfNotPresent
  controllerImage: python:3.13-alpine
  # Discover the cache public key, substituter and download token with attic use.
  configureNix: true
  jobs: 5
  retrySeconds: 30
  # Reconcile missed watcher events and failed queued paths periodically.
  catchUpIntervalSeconds: 300
  drainTimeoutSeconds: 600
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
# The worker runs as root inside its pod; clients must be trusted.
# No host mounts or privileged mode are required. See CONFIGURATION.md.
scaleToZero:
  enabled: true
  idleSeconds: 300
  startupTimeoutSeconds: 600
  # One proxy replica is required to track all active connections.
  image: python:3.13-alpine
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
service:
  type: ClusterIP
tcpRoute:
  enabled: false
  parentRefs: []
