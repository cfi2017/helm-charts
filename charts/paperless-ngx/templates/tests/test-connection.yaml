apiVersion: v1
kind: Pod
metadata:
  name: {{ include "paperless-ngx.fullname" . }}-test-connection
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Retain the completed pod so `helm test --logs` can retrieve its logs.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: connection
      image: busybox:1.37.0
      command: ['wget']
      args: ['--spider', '--timeout=30', 'http://{{ include "paperless-ngx.fullname" . }}:{{ .Values.service.port }}/']
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
