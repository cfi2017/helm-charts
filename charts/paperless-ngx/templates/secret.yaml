{{- if not .Values.paperless.existingSecret }}
{{- $name := include "paperless-ngx.fullname" . }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.paperless.secretKey }}
  secret-key: {{ .Values.paperless.secretKey | b64enc | quote }}
  {{- else if and $secret $secret.data (index $secret.data "secret-key") }}
  secret-key: {{ index $secret.data "secret-key" | quote }}
  {{- else }}
  secret-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
