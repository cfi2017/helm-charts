{{- if not .Values.auth.existingSecret }}
{{- $name := printf "%s-auth" (include "attic.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "attic.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKey }}: {{ if $existing }}{{ index $existing.data .Values.auth.secretKey | required "existing authentication Secret is missing the configured key" }}{{ else }}{{ genPrivateKey "rsa" | b64enc | b64enc }}{{ end }}
{{- end }}
