apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-web" (include "opencve.fullname" .) }}
  labels:
    {{- include "opencve.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "opencve.componentSelectorLabels" (dict "root" . "component" "web") | nindent 4 }}
