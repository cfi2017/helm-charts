{{- if .Values.web.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-web" (include "opencve.fullname" .) }}
  labels:
    {{- include "opencve.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
  {{- with .Values.web.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.web.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.web.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.web.httpRoute.rules }}
    - {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ printf "%s-web" (include "opencve.fullname" $) }}
          port: {{ $.Values.web.service.port }}
    {{- end }}
{{- end }}
