apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencve.fullname" . }}
  labels:
    {{- include "opencve.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.opencve.existingSecret }}
  {{ .Values.opencve.existingSecretKeys.secretKey }}: {{ .Values.opencve.secretKey | b64enc | quote }}
  {{- end }}
  {{- if not .Values.database.existingSecret }}
  {{ .Values.database.existingSecretKeys.opencveDatabaseUrl }}: {{ include "opencve.databaseUrl" . | b64enc | quote }}
  {{- end }}
