apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opencve.fullname" . }}
  labels:
    {{- include "opencve.labels" . | nindent 4 }}
data:
  GUNICORN_CMD_ARGS: {{ .Values.opencve.gunicorn.args | quote }}
  OPENCVE_WEB_BASE_URL: {{ .Values.opencve.baseUrl | quote }}
  OPENCVE_KB_REPO_PATH: {{ printf "%s/opencve-kb" .Values.opencve.repositories.mountPath | quote }}
  OPENCVE_MITRE_REPO_PATH: {{ printf "%s/cvelistV5" .Values.opencve.repositories.mountPath | quote }}
  OPENCVE_NVD_REPO_PATH: {{ printf "%s/opencve-nvd" .Values.opencve.repositories.mountPath | quote }}
  OPENCVE_REDHAT_REPO_PATH: {{ printf "%s/opencve-redhat" .Values.opencve.repositories.mountPath | quote }}
  OPENCVE_VULNRICHMENT_REPO_PATH: {{ printf "%s/vulnrichment" .Values.opencve.repositories.mountPath | quote }}
  opencve-nginx.conf: |
    server {
        listen {{ .Values.web.nginx.port }};
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:{{ .Values.web.port }};
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
        }

        location /static/ {
            root /var/www/opencve/;
        }
    }
